<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>背单词 Web App</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 16px;
      color: #333;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      position: relative;
    }

    /* 头部布局与设置按钮 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 { 
      font-size: 22px; 
      margin: 0; 
      color: #1a1a1a;
    }
    .icon-btn {
      background: #f8f9fa;
      border: 1px solid #ced4da;
      color: #333;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      height: 38px;
    }
    .icon-btn:hover { background: #e9ecef; }

    /* 单词卡片样式 */
    .card {
      min-height: 280px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      background: #fafafa;
    }
    .word-title {
      font-size: 32px;
      font-weight: bold;
      color: #2b2b2b;
      margin-bottom: 6px;
      word-break: break-word;
    }
    .phonetic {
      font-size: 15px;
      color: #666;
      margin-bottom: 12px;
    }
    .phonetic span { margin-right: 12px; }
    
    .section-block { margin-top: 10px; }
    .trans-item { font-size: 15px; margin-bottom: 4px; line-height: 1.4; }
    .trans-type {
      font-weight: bold;
      color: #0d6efd;
      margin-right: 6px;
    }
    
    .sub-title { font-size: 13px; font-weight: bold; color: #888; margin-top: 10px; margin-bottom: 4px; }
    .phrase-item, .sentence-item { font-size: 14px; color: #444; margin-bottom: 6px; line-height: 1.4; }
    .translation-text { color: #666; margin-left: 4px; }

    .progress {
      text-align: right;
      font-size: 13px;
      color: #888;
      margin-top: 8px;
    }

    /* 底部操作按钮区域 */
    .action-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    
    button {
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 500;
      border-radius: 8px;
      border: none;
      background-color: #0d6efd;
      color: white;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button:active { transform: scale(0.98); }
    button.secondary { 
      background-color: #6c757d; 
      flex: 1;
    }
    #playBtn {
      flex: 2;
    }

    /* ---------------- 弹窗 (Modal) 样式 ---------------- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: #fff;
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: bold;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #888;
      height: auto;
      padding: 4px;
    }

    /* 设置控件内部样式 */
    .setting-group {
      margin-bottom: 16px;
    }
    .setting-label {
      font-size: 14px;
      font-weight: bold;
      color: #495057;
      margin-bottom: 6px;
    }
    select {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #ced4da;
      background-color: #fff;
      outline: none;
      height: 42px;
    }
    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .checkbox-grid label {
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    .checkbox-grid input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    /* 移动端适配 */
    @media (max-width: 600px) {
      body { padding: 10px; }
      .container { padding: 14px; }
      .word-title { font-size: 28px; }
      .card { min-height: 240px; padding: 16px; }
      .checkbox-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>背单词 Web App</h1>
    <button class="icon-btn" onclick="openSettings()">⚙️ 设置</button>
  </div>

  <div class="card" id="wordCard">等待加载词库...</div>

  <div class="progress" id="progressInfo">0 / 0</div>

  <div class="action-group">
    <button class="secondary" onclick="prevWord()">上一个</button>
    <button id="playBtn" onclick="togglePlay()">▶ 开始朗读</button>
    <button class="secondary" onclick="nextWord()">下一个</button>
  </div>
</div>

<div class="modal-overlay" id="settingsModal" onclick="closeModalOnOverlay(event)">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">⚙️ 偏好设置</div>
      <button class="close-btn" onclick="closeSettings()">&times;</button>
    </div>

    <div class="setting-group">
      <div class="setting-label">词库选择</div>
      <select id="fileSelect" onchange="loadVocabulary()">
        <option value="">获取列表中...</option>
      </select>
    </div>

    <div class="setting-group">
      <div class="setting-label">英文朗读次数</div>
      <select id="repeatCount">
        <option value="1">读 1 次</option>
        <option value="2" selected>读 2 次</option>
        <option value="3">读 3 次</option>
      </select>
    </div>

    <div class="setting-group">
      <div class="setting-label">播放顺序</div>
      <select id="playMode">
        <option value="sequence" selected>🔁 顺序播放</option>
        <option value="random">🔀 随机播放</option>
      </select>
    </div>

    <div class="setting-group">
      <div class="setting-label">切换方式</div>
      <select id="switchMode" onchange="toggleIntervalOption()">
        <option value="auto" selected>⏩ 自动切换下一个</option>
        <option value="manual">⏸ 手动切换下一个</option>
      </select>
    </div>

    <div class="setting-group" id="intervalGroup">
      <div class="setting-label">自动切换间隔时间</div>
      <select id="intervalTime">
        <option value="3000" selected>⏱ 3 秒</option>
        <option value="5000">⏱ 5 秒</option>
        <option value="10000">⏱ 10 秒</option>
      </select>
    </div>

    <div class="setting-group">
      <div class="setting-label">卡片内容显示</div>
      <div class="checkbox-grid">
        <label><input type="checkbox" id="showWord" checked onchange="renderCard()"> 单词</label>
        <label><input type="checkbox" id="showPhonetic" checked onchange="renderCard()"> 音标</label>
        <label><input type="checkbox" id="showTrans" checked onchange="renderCard()"> 释义</label>
        <label><input type="checkbox" id="showPhrases" checked onchange="renderCard()"> 短语</label>
        <label><input type="checkbox" id="showSentences" checked onchange="renderCard()"> 例句</label>
      </div>
    </div>

    <div style="margin-top: 20px;">
      <button style="width: 100%;" onclick="closeSettings()">完成并保存</button>
    </div>
  </div>
</div>

<script>
  const API_URL = 'https://api.github.com/repos/KyleBing/english-vocabulary/contents/json_original/json-full';
  const CDN_BASE_URL = 'https://cdn.jsdelivr.net/gh/KyleBing/english-vocabulary@master/json_original/json-full/';
  
  let vocabList = [];
  let currentIndex = 0;
  let isPlaying = false;
  let autoTimer = null;

  const synth = window.speechSynthesis;

  window.onload = () => {
    fetchFileList();
    toggleIntervalOption();
  };

  // 弹窗控制逻辑
  function openSettings() {
    document.getElementById('settingsModal').classList.add('active');
  }

  function closeSettings() {
    document.getElementById('settingsModal').classList.remove('active');
  }

  function closeModalOnOverlay(e) {
    if (e.target.id === 'settingsModal') {
      closeSettings();
    }
  }

  // 根据“切换方式”控制“间隔时间”下拉框的显示/隐藏
  function toggleIntervalOption() {
    const switchMode = document.getElementById('switchMode').value;
    const intervalGroup = document.getElementById('intervalGroup');
    if (switchMode === 'auto') {
      intervalGroup.style.display = 'block';
    } else {
      intervalGroup.style.display = 'none';
    }
  }

  // 1. 获取文件列表
  async function fetchFileList() {
    const select = document.getElementById('fileSelect');
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error('读取目录失败');
      const files = await res.json();
      const jsonFiles = files.filter(f => f.name.endsWith('.json'));

      if (jsonFiles.length === 0) {
        select.innerHTML = '<option value="">未找到文件</option>';
        return;
      }

      select.innerHTML = '';
      jsonFiles.forEach(file => {
        const opt = document.createElement('option');
        opt.value = file.name;
        opt.textContent = file.name.replace('.json', '');
        select.appendChild(opt);
      });

      loadVocabulary();
    } catch (err) {
      console.error(err);
      select.innerHTML = '<option value="">获取失败</option>';
      document.getElementById('wordCard').innerHTML = '<span style="color:red;">无法获取词库列表，请检查网络。</span>';
    }
  }

  // 2. 解析 JSON 数据结构
  function parseWordItem(item) {
    if (!item) return { word: '', uk: '', us: '', translations: [], phrases: [], sentences: [] };

    const inner = item.content?.word?.content || {};

    const word = item.headWord || item.word || inner.wordHead || '';
    const uk = inner.ukphone || item.uk || '';
    const us = inner.usphone || item.us || '';

    let translations = [];
    if (inner.trans && Array.isArray(inner.trans)) {
      translations = inner.trans.map(t => ({
        type: t.pos || t.type || '',
        translation: t.tranCn || t.translation || ''
      }));
    } else if (item.translations && Array.isArray(item.translations)) {
      translations = item.translations;
    }

    let phrases = [];
    const rawPhrases = inner.phrase?.phrases || item.phrases;
    if (rawPhrases && Array.isArray(rawPhrases)) {
      phrases = rawPhrases.map(p => ({
        phrase: p.pContent || p.phrase || '',
        translation: p.pCn || p.translation || ''
      }));
    }

    let sentences = [];
    const rawSentences = inner.sentence?.sentences || item.sentences;
    if (rawSentences && Array.isArray(rawSentences)) {
      sentences = rawSentences.map(s => ({
        sentence: s.sContent || s.sentence || '',
        translation: s.sCn || s.translation || ''
      }));
    }

    return { word, uk, us, translations, phrases, sentences };
  }

  // 3. 加载词库
  async function loadVocabulary() {
    stopAudio();
    const fileName = document.getElementById('fileSelect').value;
    if (!fileName) return;

    const card = document.getElementById('wordCard');
    card.innerHTML = '正在读取词库，请稍候...';

    try {
      const response = await fetch(CDN_BASE_URL + encodeURIComponent(fileName));
      if (!response.ok) throw new Error("网络响应异常");
      vocabList = await response.json();
      currentIndex = 0;
      renderCard();
    } catch (err) {
      card.innerHTML = '<span style="color:red;">词库加载失败，请检查网络连接。</span>';
      console.error('加载 JSON 失败:', err);
    }
  }

  // 4. 渲染界面
  function renderCard() {
    if (!vocabList || vocabList.length === 0) return;

    const parsed = parseWordItem(vocabList[currentIndex]);

    const showWord = document.getElementById('showWord').checked;
    const showPhonetic = document.getElementById('showPhonetic').checked;
    const showTrans = document.getElementById('showTrans').checked;
    const showPhrases = document.getElementById('showPhrases').checked;
    const showSentences = document.getElementById('showSentences').checked;

    let html = '';

    if (showWord && parsed.word) {
      html += `<div class="word-title">${parsed.word}</div>`;
    }

    if (showPhonetic && (parsed.uk || parsed.us)) {
      html += `<div class="phonetic">`;
      if (parsed.uk) html += `<span>英 [/${parsed.uk}/]</span>`;
      if (parsed.us) html += `<span>美 [/${parsed.us}/]</span>`;
      html += `</div>`;
    }

    if (showTrans && parsed.translations.length > 0) {
      html += `<div class="section-block">`;
      parsed.translations.forEach(t => {
        html += `<div class="trans-item"><span class="trans-type">${t.type}</span>${t.translation}</div>`;
      });
      html += `</div>`;
    }

    if (showPhrases && parsed.phrases.length > 0) {
      html += `<div class="section-block"><div class="sub-title">常见短语：</div>`;
      parsed.phrases.forEach(p => {
        html += `<div class="phrase-item"><b>${p.phrase}</b><span class="translation-text">${p.translation}</span></div>`;
      });
      html += `</div>`;
    }

    if (showSentences && parsed.sentences.length > 0) {
      html += `<div class="section-block"><div class="sub-title">例句：</div>`;
      parsed.sentences.forEach(s => {
        html += `<div class="sentence-item"><div>${s.sentence}</div><div class="translation-text">${s.translation}</div></div>`;
      });
      html += `</div>`;
    }

    document.getElementById('wordCard').innerHTML = html || '<span style="color:#aaa;">（无内容显示，请在设置中勾选显示设置）</span>';
    document.getElementById('progressInfo').innerText = `${currentIndex + 1} / ${vocabList.length}`;
  }

  // 5. 播放控制
  function togglePlay() {
    if (isPlaying) {
      stopAudio();
    } else {
      synth.resume();
      isPlaying = true;
      document.getElementById('playBtn').innerText = '⏸ 暂停朗读';
      playCurrentWord();
    }
  }

  function stopAudio() {
    isPlaying = false;
    if (autoTimer) clearTimeout(autoTimer);
    synth.cancel();
    document.getElementById('playBtn').innerText = '▶ 开始朗读';
  }

  // 6. 朗读核心逻辑
  function playCurrentWord() {
    if (!isPlaying || currentIndex >= vocabList.length) {
      stopAudio();
      return;
    }

    const parsed = parseWordItem(vocabList[currentIndex]);
    const repeatTimes = parseInt(document.getElementById('repeatCount').value, 10);
    
    let chineseText = parsed.translations.map(t => t.translation).join('，');

    synth.cancel();
    if (synth.paused) synth.resume();

    let playlist = [];

    if (parsed.word) {
      for (let i = 0; i < repeatTimes; i++) {
        playlist.push({ text: parsed.word, lang: 'en-US' });
      }
    }

    if (chineseText) {
      playlist.push({ text: chineseText, lang: 'zh-CN' });
    }

    if (playlist.length === 0) {
      handleNextStep();
      return;
    }

    function speakIndex(idx) {
      if (!isPlaying) return;

      if (idx >= playlist.length) {
        handleNextStep();
        return;
      }

      const item = playlist[idx];
      const utterance = new SpeechSynthesisUtterance(item.text);
      utterance.lang = item.lang;
      utterance.rate = 0.9;

      utterance.onend = () => speakIndex(idx + 1);
      utterance.onerror = (e) => {
        console.error('朗读出错：', e);
        speakIndex(idx + 1);
      };

      synth.speak(utterance);
    }

    speakIndex(0);
  }

  // 判断是自动切换下一个还是手动停止
  function handleNextStep() {
    const switchMode = document.getElementById('switchMode').value;
    
    if (switchMode === 'manual') {
      stopAudio(); // 手动模式下朗读完毕即停下
    } else {
      scheduleNext(); // 自动模式下跳到下一个单词
    }
  }

  function scheduleNext() {
    if (!isPlaying) return;

    // 获取设置的间隔时间毫秒值
    const delay = parseInt(document.getElementById('intervalTime').value, 10) || 3000;

    autoTimer = setTimeout(() => {
      if (!isPlaying) return;

      const playMode = document.getElementById('playMode').value;

      if (playMode === 'random') {
        if (vocabList.length > 1) {
          let randomIndex = currentIndex;
          while (randomIndex === currentIndex) {
            randomIndex = Math.floor(Math.random() * vocabList.length);
          }
          currentIndex = randomIndex;
        }
        renderCard();
        playCurrentWord();
      } else {
        if (currentIndex < vocabList.length - 1) {
          currentIndex++;
          renderCard();
          playCurrentWord();
        } else {
          stopAudio();
          alert("已到达本词库最后一个词条！");
        }
      }
    }, delay);
  }

  function nextWord() {
    const switchMode = document.getElementById('switchMode').value;
    const playMode = document.getElementById('playMode').value;
    const wasPlaying = isPlaying;

    stopAudio();

    if (playMode === 'random') {
      if (vocabList.length > 1) {
        let randomIndex = currentIndex;
        while (randomIndex === currentIndex) {
          randomIndex = Math.floor(Math.random() * vocabList.length);
        }
        currentIndex = randomIndex;
      }
    } else {
      if (currentIndex < vocabList.length - 1) {
        currentIndex++;
      }
    }

    renderCard();

    // 在手动模式下，或之前本身就处于播放状态时，点击“下一个”自动开启朗读
    if (switchMode === 'manual' || wasPlaying) {
      synth.resume();
      isPlaying = true;
      document.getElementById('playBtn').innerText = '⏸ 暂停朗读';
      playCurrentWord();
    }
  }

  function prevWord() {
    const switchMode = document.getElementById('switchMode').value;
    const wasPlaying = isPlaying;

    stopAudio();

    if (currentIndex > 0) {
      currentIndex--;
      renderCard();

      // 在手动模式下，或之前本身就处于播放状态时，点击“上一个”自动开启朗读
      if (switchMode === 'manual' || wasPlaying) {
        synth.resume();
        isPlaying = true;
        document.getElementById('playBtn').innerText = '⏸ 暂停朗读';
        playCurrentWord();
      }
    }
  }
</script>

</body>
</html>
