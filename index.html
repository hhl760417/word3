<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>背单词 Web App (支持后台/锁屏播放)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 16px;
      color: #333;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h1 { 
      text-align: center; 
      font-size: 22px; 
      margin-top: 0; 
      margin-bottom: 16px; 
      color: #1a1a1a;
    }
    
    .panel {
      background: #f8f9fa;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      border: 1px solid #e9ecef;
    }
    .panel-title {
      font-weight: bold;
      margin-bottom: 10px;
      color: #495057;
      font-size: 14px;
    }
    
    .control-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .control-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .control-item label {
      font-size: 14px;
      white-space: nowrap;
      color: #495057;
      font-weight: 500;
    }
    
    select {
      flex: 1;
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #ced4da;
      background-color: #fff;
      outline: none;
      height: 42px;
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
    }
    .checkbox-group label {
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .card {
      min-height: 260px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      background: #fafafa;
    }
    .word-title {
      font-size: 32px;
      font-weight: bold;
      color: #2b2b2b;
      margin-bottom: 6px;
      word-break: break-word;
    }
    .phonetic {
      font-size: 15px;
      color: #666;
      margin-bottom: 12px;
    }
    .phonetic span { margin-right: 12px; }
    
    .section-block { margin-top: 10px; }
    .trans-item { font-size: 15px; margin-bottom: 4px; line-height: 1.4; }
    .trans-type {
      font-weight: bold;
      color: #0d6efd;
      margin-right: 6px;
    }
    
    .sub-title { font-size: 13px; font-weight: bold; color: #888; margin-top: 10px; margin-bottom: 4px; }
    .phrase-item, .sentence-item { font-size: 14px; color: #444; margin-bottom: 6px; line-height: 1.4; }
    .translation-text { color: #666; margin-left: 4px; }

    .progress {
      text-align: right;
      font-size: 13px;
      color: #888;
      margin-top: 8px;
    }

    .action-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    
    button {
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 500;
      border-radius: 8px;
      border: none;
      background-color: #0d6efd;
      color: white;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button:active { transform: scale(0.98); }
    button.secondary { 
      background-color: #6c757d; 
      flex: 1;
    }
    #playBtn {
      flex: 2;
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .container { padding: 14px; border-radius: 10px; }
      
      .control-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      
      .checkbox-group {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px 8px;
      }

      .word-title { font-size: 28px; }
      .card { min-height: 220px; padding: 16px; }

      .action-group {
        flex-direction: row;
      }
      button.secondary {
        flex: 1;
        padding: 10px 8px;
        font-size: 14px;
      }
      #playBtn {
        flex: 1.8;
        font-size: 14px;
        padding: 10px 8px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>背单词 Web App</h1>

  <audio id="audioPlayer" preload="auto" style="display:none;"></audio>

  <div class="panel">
    <div class="control-grid">
      <div class="control-item">
        <label>词库：</label>
        <select id="fileSelect" onchange="loadVocabulary()">
          <option value="">获取列表中...</option>
        </select>
      </div>
      
      <div class="control-item">
        <label>朗读：</label>
        <select id="repeatCount">
          <option value="1">读 1 次</option>
          <option value="2" selected>读 2 次</option>
          <option value="3">读 3 次</option>
        </select>
      </div>

      <div class="control-item">
        <label>模式：</label>
        <select id="playMode">
          <option value="sequence" selected>🔁 顺序播放</option>
          <option value="random">🔀 随机播放</option>
        </select>
      </div>
    </div>

    <div class="panel-title" style="margin-top: 12px; margin-bottom: 8px;">显示控制：</div>
    <div class="checkbox-group">
      <label><input type="checkbox" id="showWord" checked onchange="renderCard()"> 单词</label>
      <label><input type="checkbox" id="showPhonetic" checked onchange="renderCard()"> 音标</label>
      <label><input type="checkbox" id="showTrans" checked onchange="renderCard()"> 释义</label>
      <label><input type="checkbox" id="showPhrases" checked onchange="renderCard()"> 短语</label>
      <label><input type="checkbox" id="showSentences" checked onchange="renderCard()"> 例句</label>
    </div>
  </div>

  <div class="card" id="wordCard">等待加载词库...</div>

  <div class="progress" id="progressInfo">0 / 0</div>

  <div class="action-group">
    <button class="secondary" onclick="prevWord()">上一个</button>
    <button id="playBtn" onclick="togglePlay()">▶ 开始朗读</button>
    <button class="secondary" onclick="nextWord()">下一个</button>
  </div>
</div>

<script>
  const API_URL = 'https://api.github.com/repos/KyleBing/english-vocabulary/contents/json_original/json-full';
  const CDN_BASE_URL = 'https://cdn.jsdelivr.net/gh/KyleBing/english-vocabulary@master/json_original/json-full/';
  
  let vocabList = [];
  let currentIndex = 0;
  let isPlaying = false;
  let autoTimer = null;

  const audioPlayer = document.getElementById('audioPlayer');

  window.onload = () => {
    fetchFileList();
    setupMediaSessionHandlers();
  };

  // 1. 获取文件列表
  async function fetchFileList() {
    const select = document.getElementById('fileSelect');
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error('读取目录失败');
      const files = await res.json();
      const jsonFiles = files.filter(f => f.name.endsWith('.json'));

      if (jsonFiles.length === 0) {
        select.innerHTML = '<option value="">未找到文件</option>';
        return;
      }

      select.innerHTML = '';
      jsonFiles.forEach(file => {
        const opt = document.createElement('option');
        opt.value = file.name;
        opt.textContent = file.name.replace('.json', '');
        select.appendChild(opt);
      });

      loadVocabulary();
    } catch (err) {
      console.error(err);
      select.innerHTML = '<option value="">获取失败</option>';
      document.getElementById('wordCard').innerHTML = '<span style="color:red;">无法获取词库列表，请检查网络。</span>';
    }
  }

  // 2. 解析 JSON 数据结构
  function parseWordItem(item) {
    if (!item) return { word: '', uk: '', us: '', translations: [], phrases: [], sentences: [] };

    const inner = item.content?.word?.content || {};

    const word = item.headWord || item.word || inner.wordHead || '';
    const uk = inner.ukphone || item.uk || '';
    const us = inner.usphone || item.us || '';

    let translations = [];
    if (inner.trans && Array.isArray(inner.trans)) {
      translations = inner.trans.map(t => ({
        type: t.pos || t.type || '',
        translation: t.tranCn || t.translation || ''
      }));
    } else if (item.translations && Array.isArray(item.translations)) {
      translations = item.translations;
    }

    let phrases = [];
    const rawPhrases = inner.phrase?.phrases || item.phrases;
    if (rawPhrases && Array.isArray(rawPhrases)) {
      phrases = rawPhrases.map(p => ({
        phrase: p.pContent || p.phrase || '',
        translation: p.pCn || p.translation || ''
      }));
    }

    let sentences = [];
    const rawSentences = inner.sentence?.sentences || item.sentences;
    if (rawSentences && Array.isArray(rawSentences)) {
      sentences = rawSentences.map(s => ({
        sentence: s.sContent || s.sentence || '',
        translation: s.sCn || s.translation || ''
      }));
    }

    return { word, uk, us, translations, phrases, sentences };
  }

  // 3. 加载词库
  async function loadVocabulary() {
    stopAudio();
    const fileName = document.getElementById('fileSelect').value;
    if (!fileName) return;

    const card = document.getElementById('wordCard');
    card.innerHTML = '正在读取词库，请稍候...';

    try {
      const response = await fetch(CDN_BASE_URL + encodeURIComponent(fileName));
      if (!response.ok) throw new Error("网络响应异常");
      vocabList = await response.json();
      currentIndex = 0;
      renderCard();
    } catch (err) {
      card.innerHTML = '<span style="color:red;">词库加载失败，请检查网络连接。</span>';
      console.error('加载 JSON 失败:', err);
    }
  }

  // 4. 渲染界面
  function renderCard() {
    if (!vocabList || vocabList.length === 0) return;

    const parsed = parseWordItem(vocabList[currentIndex]);

    const showWord = document.getElementById('showWord').checked;
    const showPhonetic = document.getElementById('showPhonetic').checked;
    const showTrans = document.getElementById('showTrans').checked;
    const showPhrases = document.getElementById('showPhrases').checked;
    const showSentences = document.getElementById('showSentences').checked;

    let html = '';

    if (showWord && parsed.word) {
      html += `<div class="word-title">${parsed.word}</div>`;
    }

    if (showPhonetic && (parsed.uk || parsed.us)) {
      html += `<div class="phonetic">`;
      if (parsed.uk) html += `<span>英 [/${parsed.uk}/]</span>`;
      if (parsed.us) html += `<span>美 [/${parsed.us}/]</span>`;
      html += `</div>`;
    }

    if (showTrans && parsed.translations.length > 0) {
      html += `<div class="section-block">`;
      parsed.translations.forEach(t => {
        html += `<div class="trans-item"><span class="trans-type">${t.type}</span>${t.translation}</div>`;
      });
      html += `</div>`;
    }

    if (showPhrases && parsed.phrases.length > 0) {
      html += `<div class="section-block"><div class="sub-title">常见短语：</div>`;
      parsed.phrases.forEach(p => {
        html += `<div class="phrase-item"><b>${p.phrase}</b><span class="translation-text">${p.translation}</span></div>`;
      });
      html += `</div>`;
    }

    if (showSentences && parsed.sentences.length > 0) {
      html += `<div class="section-block"><div class="sub-title">例句：</div>`;
      parsed.sentences.forEach(s => {
        html += `<div class="sentence-item"><div>${s.sentence}</div><div class="translation-text">${s.translation}</div></div>`;
      });
      html += `</div>`;
    }

    document.getElementById('wordCard').innerHTML = html || '<span style="color:#aaa;">（无内容显示，请勾选显示设置）</span>';
    document.getElementById('progressInfo').innerText = `${currentIndex + 1} / ${vocabList.length}`;

    // 更新系统锁屏/后台的媒体卡片信息
    updateMediaSession(parsed);
  }

  // 5. 音频 API 路由生成器（已被修正为手机网络兼容版本）
  function getAudioUrl(text, lang) {
    if (lang === 'en-US') {
      // 有道词典美音接口
      return `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(text)}&type=2`;
    } else {
      // 百度 TTS 中文朗读接口（完美支持国内移动端网络）
      return `https://fanyi.baidu.com/getvoice?lan=zh&spd=5&source=web&text=${encodeURIComponent(text)}`;
    }
  }

  function togglePlay() {
    if (isPlaying) {
      stopAudio();
    } else {
      isPlaying = true;
      document.getElementById('playBtn').innerText = '⏸ 暂停朗读';
      playCurrentWord();
    }
  }

  function stopAudio() {
    isPlaying = false;
    if (autoTimer) clearTimeout(autoTimer);
    audioPlayer.pause();
    audioPlayer.onended = null;
    document.getElementById('playBtn').innerText = '▶ 开始朗读';
  }

  function playCurrentWord() {
    if (!isPlaying || currentIndex >= vocabList.length) {
      stopAudio();
      return;
    }

    const parsed = parseWordItem(vocabList[currentIndex]);
    const repeatTimes = parseInt(document.getElementById('repeatCount').value, 10);
    let chineseText = parsed.translations.map(t => t.translation).join('，');

    let playlist = [];

    // 1. 构建英文音频队列
    if (parsed.word) {
      for (let i = 0; i < repeatTimes; i++) {
        playlist.push(getAudioUrl(parsed.word, 'en-US'));
      }
    }

    // 2. 构建中文音频队列
    if (chineseText) {
      playlist.push(getAudioUrl(chineseText, 'zh-CN'));
    }

    if (playlist.length === 0) {
      scheduleNext();
      return;
    }

    function playAudioSequence(index) {
      if (!isPlaying) return;

      if (index >= playlist.length) {
        scheduleNext();
        return;
      }

      audioPlayer.src = playlist[index];
      audioPlayer.play().catch(err => {
        console.warn('音频播放中断或被拦截，继续播放下一个:', err);
        playAudioSequence(index + 1);
      });

      audioPlayer.onended = () => {
        playAudioSequence(index + 1);
      };
    }

    playAudioSequence(0);
  }

  function scheduleNext() {
    if (!isPlaying) return;

    autoTimer = setTimeout(() => {
      if (!isPlaying) return;

      const mode = document.getElementById('playMode').value;

      if (mode === 'random') {
        if (vocabList.length > 1) {
          let randomIndex = currentIndex;
          while (randomIndex === currentIndex) {
            randomIndex = Math.floor(Math.random() * vocabList.length);
          }
          currentIndex = randomIndex;
        }
        renderCard();
        playCurrentWord();
      } else
